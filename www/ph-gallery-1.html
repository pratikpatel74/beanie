<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  width: 1270px; height: 760px; overflow: hidden;
  background: #0d1f1a;
  font-family: 'Inter', -apple-system, sans-serif;
  display: flex; align-items: center; justify-content: center;
}
.stage {
  width: 1270px; height: 760px;
  background: #0d1f1a;
  display: flex; align-items: center;
  justify-content: space-between;
  padding: 0 100px;
  position: relative;
  overflow: hidden;
}
.stage::before {
  content: '';
  position: absolute;
  top: -100px; left: -50px;
  width: 700px; height: 600px;
  background: radial-gradient(ellipse, rgba(124,111,255,0.07) 0%, transparent 65%);
  pointer-events: none;
}
.stage::after {
  content: '';
  position: absolute;
  bottom: -100px; right: -50px;
  width: 600px; height: 500px;
  background: radial-gradient(ellipse, rgba(240,180,41,0.07) 0%, transparent 65%);
  pointer-events: none;
}
.left {
  display: flex; flex-direction: column;
  align-items: flex-start;
  gap: 0;
  z-index: 1;
  max-width: 520px;
}
.tag {
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(240,180,41,0.12);
  border: 1px solid rgba(240,180,41,0.3);
  border-radius: 100px;
  padding: 7px 18px;
  font-size: 13px; font-weight: 700;
  color: #F0B429;
  letter-spacing: 0.3px;
  margin-bottom: 28px;
}
.title {
  font-size: 86px; font-weight: 900;
  color: #F0B429;
  letter-spacing: -3px;
  line-height: 0.95;
  margin-bottom: 22px;
}
.sub {
  font-size: 22px; font-weight: 400;
  color: #8aada1;
  line-height: 1.45;
  margin-bottom: 42px;
  max-width: 420px;
}
.pills {
  display: flex; gap: 10px; flex-wrap: wrap;
}
.pill {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 100px;
  padding: 8px 18px;
  font-size: 13px; font-weight: 600;
  color: #f0f4f2;
}
.right {
  display: flex; align-items: center; justify-content: center;
  gap: 18px;
  z-index: 1;
}
.card {
  width: 110px; height: 158px;
  background: #fff;
  border-radius: 14px;
  border: 1px solid rgba(0,0,0,0.08);
  box-shadow: 0 12px 40px rgba(0,0,0,0.6);
  display: flex; align-items: center; justify-content: center;
  font-family: Georgia, serif;
  position: relative;
  flex-shrink: 0;
}
.card .cr {
  position: absolute;
  display: flex; flex-direction: column;
  align-items: flex-start; line-height: 1; gap: 2px;
}
.card .cr.tl { top: 10px; left: 12px; }
.card .cr.br { bottom: 10px; right: 12px; transform: rotate(180deg); }
.card .cr .r { font-size: 20px; font-weight: 800; }
.card .cr .s { font-size: 15px; }
.card .pip { font-size: 46px; line-height: 1; }
.red { color: #c0392b; }
.blk { color: #1a1a2e; }
.card.bc {
  background: linear-gradient(135deg, #2d200a, #1c1408);
  border: 3px solid #F0B429;
  box-shadow: 0 0 0 1px rgba(240,180,41,0.3), 0 12px 40px rgba(0,0,0,0.7);
}
.card.bc .pip { color: #F0B429; font-size: 54px; }
.card.bc .cr { color: #F0B429; }
.card.bc .label {
  position: absolute; bottom: 10px;
  left: 0; right: 0; text-align: center;
  font-size: 9px; font-weight: 800;
  letter-spacing: 2px;
  font-family: 'Inter', sans-serif;
  color: #F0B429;
}
.card.float1 { transform: rotate(-8deg) translateY(-10px); }
.card.float2 { transform: rotate(0deg) translateY(-24px); }
.card.float3 { transform: rotate(7deg) translateY(-8px); }
.url {
  position: absolute;
  bottom: 36px; left: 50%; transform: translateX(-50%);
  font-size: 16px; font-weight: 700;
  color: rgba(255,255,255,0.2);
  letter-spacing: 0.5px;
  z-index: 1;
}
</style>
</head>
<body>
<div class="stage">
  <div class="left">
    <div class="tag">★ Wild card rummy · Free to play</div>
    <div class="title">BEANIE</div>
    <div class="sub">Every round a different card rank becomes the wild. Build sets, steal from opponents, go out first.</div>
    <div class="pills">
      <div class="pill">2–4 players</div>
      <div class="pill">No download</div>
      <div class="pill">Any browser</div>
      <div class="pill">Share a link</div>
    </div>
  </div>
  <div class="right">
    <div class="card float1">
      <div class="cr tl red"><span class="r">Q</span><span class="s">♥</span></div>
      <span class="pip red">♥</span>
      <div class="cr br red"><span class="r">Q</span><span class="s">♥</span></div>
    </div>
    <div class="card bc float2">
      <div class="cr tl"><span class="r">★</span></div>
      <span class="pip">★</span>
      <span class="label">BEANIE</span>
    </div>
    <div class="card float3">
      <div class="cr tl blk"><span class="r">Q</span><span class="s">♠</span></div>
      <span class="pip blk">♠</span>
      <div class="cr br blk"><span class="r">Q</span><span class="s">♠</span></div>
    </div>
  </div>
  <div class="url">playbeanie.com</div>
</div>
</body>
</html>
